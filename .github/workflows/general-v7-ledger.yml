name: general-v7-ledger

on:
  pull_request:
    paths:
      - "experiments/general_v7_ledger/**"
      - ".github/workflows/general-v7-ledger.yml"
  push:
    branches: [main]
    paths:
      - "experiments/general_v7_ledger/**"
      - ".github/workflows/general-v7-ledger.yml"

permissions:
  contents: read

concurrency:
  group: general-v7-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: general-v7-ledger (${{ matrix.label }}, informational, path-scoped)
    # The admitted controls exercise Windows device-name, junction and reparse
    # semantics, and use ast.parse(optimize=...), which requires Python 3.13+.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ordinary
            python-flags: ""
          - label: optimized
            python-flags: "-O"
          - label: double-optimized
            python-flags: "-OO"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Contacts the configured Python package index. Pinned exactly.
      - name: Install pinned test dependency
        run: pip install pytest==9.0.2
      - name: Collect the General V7 acceptance surface
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python ${{ matrix.python-flags }} -B -m pytest --collect-only -q -p no:cacheprovider experiments/general_v7_ledger/tests
      - name: Run the General V7 acceptance surface
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python ${{ matrix.python-flags }} -B -m pytest -q -p no:cacheprovider experiments/general_v7_ledger/tests
      - name: Validate the committed synthetic ledger
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python ${{ matrix.python-flags }} -B -m experiments.general_v7_ledger.validate experiments/general_v7_ledger/ledger.json
